<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GenAI IAM</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#f4f7fb}.brand{font-weight:800;letter-spacing:.4px}.card{border:0;box-shadow:0 8px 25px rgba(20,40,80,.07)}.sidebar{min-height:100vh;background:#111827;color:white}.pill{border-radius:999px}.table td,.table th{vertical-align:middle}
</style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
<div class="container-fluid"><span class="navbar-brand brand">🔐 GenAI IAM</span>
{% if session.get('user_id') %}<span class="text-white small">{{session.get('name')}} · {{session.get('role')}} · <a class="text-white" href="{{url_for('logout')}}">Logout</a></span>{% endif %}
</div></nav>
<div class="container py-4">
{% with messages=get_flashed_messages(with_categories=true) %}
{% for category,message in messages %}<div class="alert alert-{{category}}">{{message}}</div>{% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</div>
</body>
</html>
